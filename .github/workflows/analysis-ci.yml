
name: FinAssist Analysis CI

on:
  push:
    branches:
      - "feat/**"
      - development
      - main

  pull_request:
    branches:
      - development
      - main

  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas matplotlib seaborn nbformat nbclient ipykernel

      - name: Validate and execute EDA notebook
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat
          from nbclient import NotebookClient

          notebook_path = Path(
              "analysis/01_exploratory_data_analysis.ipynb"
          )

          if not notebook_path.exists():
              raise FileNotFoundError(
                  f"Notebook not found: {notebook_path}"
              )

          notebook = nbformat.read(notebook_path, as_version=4)

          # Check notebook structure
          nbformat.validate(notebook)

          # Execute every code cell in a fresh kernel
          client = NotebookClient(
              notebook,
              timeout=600,
              kernel_name="python3",
              resources={
                  "metadata": {
                      "path": str(notebook_path.parent.resolve())
                  }
              }
          )

          client.execute()

          # Validate again after execution
          nbformat.validate(notebook)

          print("SUCCESS: Notebook structure is valid.")
          print("SUCCESS: All notebook cells executed.")
          PY
